name: build-release

# v1.6.4 같은 태그를 밀면 3개 OS 바이너리를 자동 빌드해 릴리스에 첨부합니다.
#   git tag v1.6.4 && git push origin v1.6.4
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: macos-14          # Apple Silicon (arm64)
            asset: macos-arm64
          - os: ubuntu-22.04      # 오래된 glibc 호환을 위해 22.04 사용
            asset: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: macOS 아이콘(.icns) 준비
        if: runner.os == 'macOS'
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          import os
          src = Image.open("assets/combiyso.ico").convert("RGBA")
          os.makedirs("icon.iconset", exist_ok=True)
          for name, px in [
              ("icon_16x16.png", 16), ("icon_16x16@2x.png", 32),
              ("icon_32x32.png", 32), ("icon_32x32@2x.png", 64),
              ("icon_128x128.png", 128), ("icon_128x128@2x.png", 256),
              ("icon_256x256.png", 256), ("icon_256x256@2x.png", 512),
              ("icon_512x512.png", 512), ("icon_512x512@2x.png", 1024),
          ]:
              src.resize((px, px), Image.LANCZOS).save(os.path.join("icon.iconset", name))
          PY
          iconutil -c icns icon.iconset -o assets/combiyso.icns
          ls -l assets/combiyso.icns

      - name: 빌드 (PyInstaller onedir)
        run: pyinstaller combiyso.spec --noconfirm

      # ---------- Windows ----------
      - name: 패키지 (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item dist\combiyso\combiyso.exe "컴비서.exe"
          Compress-Archive -Path dist\combiyso\* -DestinationPath "combiyso-${{ matrix.asset }}.zip"

      - name: 설치 프로그램 (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\combiyso.iss"
          Copy-Item "installer\컴비서설치.exe" "combiyso-windows-setup.exe"

      # ---------- macOS ----------
      - name: 패키지 (macOS .app)
        if: runner.os == 'macOS'
        run: |
          ls -la dist
          if [ -d "dist/컴비서.app" ]; then
            tar -C dist -czf "combiyso-${{ matrix.asset }}.tar.gz" "컴비서.app"
          else
            chmod +x dist/combiyso/combiyso
            tar -C dist -czf "combiyso-${{ matrix.asset }}.tar.gz" combiyso
          fi
          ls -lh "combiyso-${{ matrix.asset }}.tar.gz"

      # ---------- Linux ----------
      - name: 패키지 (Linux tar.gz)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/combiyso/combiyso
          tar -C dist -czf "combiyso-${{ matrix.asset }}.tar.gz" combiyso
          ls -lh "combiyso-${{ matrix.asset }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.asset }}
          path: |
            combiyso-*.zip
            combiyso-*.tar.gz
            combiyso-windows-setup.exe
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 첨부 파일 확인
        run: ls -lh assets

      - name: 릴리스 게시
        uses: softprops/action-gh-release@v2
        with:
          name: 컴비서 ${{ github.ref_name }}
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
